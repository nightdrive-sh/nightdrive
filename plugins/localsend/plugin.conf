# LocalSend (README.md): its receiver (bin/localsend run, lib/, systemd/) and Files › Send with LocalSend (nautilus-python/).
# The launcher's Tools › Send … with LocalSend rows stay in the core (Plugins.has).
name=LocalSend
icon=smartphone
description=Files from phones via the LocalSend app, with a code on the screen (experimental)
default=off
install=sudo dnf install -y openssl nautilus-python zenity && bin/localsend enable
installed=systemctl --user -q is-enabled nightdrive-localsend.service
packages=openssl nautilus-python zenity
group=plugin
version=0.1.3
author=@jarilehtinen
