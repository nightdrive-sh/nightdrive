# Screen Mirroring (README.md): doubletake, built by install.sh, and bin/mirroring. Its rows are in the core's Display menu
# and the launcher's Settings › Display (Plugins.has), and its hyprland.lua starts the daemon.
name=Screen Mirroring
icon=screen-share
description=AirPlay to an Apple TV (doubletake, experimental; compiled)
default=off
install=install.sh
installed=test -x ~/.local/bin/doubletake
packages=golang git gstreamer1 pipewire-gstreamer gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-plugin-openh264 pulseaudio-utils
group=plugin
version=0.1.2
author=@jarilehtinen
