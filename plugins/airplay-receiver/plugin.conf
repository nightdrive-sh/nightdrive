# AirPlay Receiver (README.md): UxPlay as a user service (bin/airplay-receiver run, systemd/). Its window's place is a
# rule in its hyprland.lua (float-uxplay).
name=AirPlay Receiver
icon=cast
description=Mirror an iPhone, iPad or Mac here (UxPlay, experimental)
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-airplay.service
packages=uxplay libavcodec-freeworld gstreamer1-plugin-libav rpmfusion-free-release
group=plugin
version=0.1.5
author=@jarilehtinen
