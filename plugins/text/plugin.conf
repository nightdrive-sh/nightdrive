# Text (README.md): Nightdrive's editor for plain text, a Quickshell window of its own (app/, `text`), and what opens
# .txt, .csv, .json and the rest of text/plain unless another text editor is chosen. One of Nightdrive's apps, like Notes.
name=Text
icon=file-pen-line
description=Plain text files, configs and scripts, to read and change
default=on
install=bin/text install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-text.desktop"
packages=python3 python3-gobject
group=app
# Claude reads and writes files itself: a tool to open one in a window would add nothing
mcp=none
version=0.1.0
author=@jarilehtinen
