# Disk Usage (README.md): what takes up the space in a place (Home, the system disk, a folder you choose), folder by
# folder, in a window of its own (app/, `disk-usage`), and Clean up for what is safe to empty (lib/clean.py). One of
# Nightdrive's apps, but not on every install (bundled=no): it waits in Install › Recommended. It needs only Python,
# so the installer just puts it among the desktop's apps.
name=Disk Usage
icon=chart-pie
description=What takes up the space on your disk, and the caches and Trash to clean up
default=off
install=bin/disk-usage install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-disk-usage.desktop"
group=app
bundled=no
version=0.1.0
author=@jarilehtinen
