# keyd-application-mapper (~/.config/keyd/app.conf, linked by link.sh; started by the plugin's hyprland.lua): per-app
# keys, switched as the active window changes. The launcher isn't a window: it gets the default (⇧Home + Delete, Launcher.qml).
# [class] or [class|title], globs; class and title are lower-cased with other characters as - (org.gnome.Nautilus →
# org-gnome-nautilus, "Write: Re: x" → write-re-x). Every matching section applies, a later one wins: defaults first.
# Without the mapper ⌘⌫ does nothing (not in default.conf), so a stopped mapper can't trash files by mistake.

# ⌘⌫: delete to the start of the line, like macOS
[*]
meta.backspace = macro(S-home delete)

# Terminals (any of them, Default apps › Terminal): Ctrl+U (readline: to the start of the line)
[kitty]
meta.backspace = C-u
[foot]
meta.backspace = C-u
[alacritty]
meta.backspace = C-u
[com-mitchellh-ghostty]
meta.backspace = C-u
[org-wezfurlong-wezterm]
meta.backspace = C-u

# Files: move the selection to the trash, like Finder; ⌘L types a path (Ctrl+L, the location field)
[*nautilus*]
meta.backspace = delete
meta.l = C-l

# Thunderbird: delete the message, like Mail; in the compose window it edits text
[*thunderbird*]
meta.backspace = delete
[*thunderbird*|write-*]
meta.backspace = macro(S-home delete)
[*thunderbird*|kirjoita-*]
meta.backspace = macro(S-home delete)

# ⌘L: the browser's address bar (Ctrl+L), like Safari. Only browsers: Ctrl+L clears a terminal, and the webapps
# (Default apps › webapps: class chrome-<site>__-Default) have no address bar, so chromium* doesn't match them.
[*firefox*]
meta.l = C-l
[*librewolf*]
meta.l = C-l
[zen]
meta.l = C-l
[*zen-browser*]
meta.l = C-l
[chromium*]
meta.l = C-l
[google-chrome*]
meta.l = C-l
[brave-browser*]
meta.l = C-l
[vivaldi*]
meta.l = C-l
[org-gnome-epiphany]
meta.l = C-l
[ladybird]
meta.l = C-l
