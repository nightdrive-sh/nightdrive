# keyd (/etc/keyd/default.conf, the Mac Keyboard Shortcuts plugin: install.sh; nightdrive update copies it again when it changes): Mac-style text keys as real key presses, before Hyprland.
# Hyprland's send_shortcut sometimes loses a synthetic key's release and the app keeps repeating the key (Hyprland
# #8385, #6407); keyd sends ordinary presses and releases. ⌘⌫ and ⌘L are per app: app.conf (keyd-application-mapper).
# Emergency exit: Backspace + Escape + Enter together stops keyd.

[ids]
*

[main]
# Fn: keyd's virtual keyboard can't send KEY_FN, so Fn would vanish (dictation is Fn held, bindings.lua). F19 stands in
# for it. Fn's combos (Fn+arrows, Fn+⌫ …) are made by the kernel (hid_apple) before keyd and still work.
fn = f19

# ⌘⌃L (lock, config/hypr/bindings.lua) stays itself in the apps where app.conf gives ⌘L a key of their own: keyd takes
# a key from the layer pressed last, so ⌃ then ⌘ would send the browser's Ctrl+L. A composite layer comes first.
[control+meta]
l = C-M-l

[alt]
# ⌥⌫: delete the previous word (GTK, Chromium, Firefox, Qt: Ctrl+Backspace; kitty: kitty.conf maps it to ^W)
backspace = C-backspace
