# Mac Keyboard Shortcuts (README.md): keyd, a system service, with this folder's default.conf in /etc/keyd (nightdrive
# update copies it again when it changes) and app.conf for its per-app mapper; the Files keys are nautilus-python/.
name=Mac Keyboard Shortcuts
icon=keyboard
description=⌥⌫ deletes a word, ⌘⌫ to the line start, ⌘L address bar, ⌘, settings; Files: Enter renames, ⌘O opens, ⌘⌫ to the trash
default=off
install=install.sh
installed=systemctl -q is-enabled keyd
packages=keyd nautilus-python
group=plugin
version=1.0.5
author=@jarilehtinen
