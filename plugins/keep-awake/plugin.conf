# Keep Awake (README.md): keeps the computer awake from the top bar. Nothing to install (systemd-inhibit comes with
# systemd): the installer only marks it installed, and bin/keep-awake does the rest.
name=Keep Awake
icon=coffee
description=Keeps the computer awake from the top bar: no screensaver, lock or sleep, for a while or until you turn it off
default=off
install=mkdir -p ~/.local/state/nightdrive && touch ~/.local/state/nightdrive/keep-awake
installed=test -e ~/.local/state/nightdrive/keep-awake
group=plugin
version=0.1.0
author=@jarilehtinen
