# Translate (README.md): Launcher › Tools › Translate and the `translate` command (bin/, lib/), over an engine the user picks:
# offline models in ~/.local/share/nightdrive/translate, translate-shell, Claude, or one of their own (lib/engines.json).
# The installer marks it installed and installs the default engine, Opus-MT (a 580 MB download, 160 MB kept).
name=Translate
icon=book-a
description=Type a word or a sentence in the Launcher and get it in the other language, offline or online (experimental)
default=off
install=bin/translate setup
installed=test -e ~/.local/state/nightdrive/translate
packages=python3
group=plugin
version=0.1.0
author=@jarilehtinen
