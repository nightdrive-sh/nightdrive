# Tasks (README.md): Nightdrive Tasks, tasks kept on this computer as VTODO files in a vdir, a folder per list
# (~/.local/share/nightdrive/tasks), so CalDAV can sync them later as they are. A window of its own (app/, `tasks`) that
# shows them and adds new ones, Claude's tools that add and change them (mcp.json), and a notification with Done and Later when one comes
# due (systemd/). One of Nightdrive's apps, like Mail and Contacts.
name=Tasks
icon=list-checks
description=Your tasks, what is due today, and a notification when one comes due
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-tasks-due.timer
packages=python3 libnotify
group=app
version=0.1.0
author=@jarilehtinen
welcome=Your tasks on this computer: Claude adds them, and they tell you when they're due.
