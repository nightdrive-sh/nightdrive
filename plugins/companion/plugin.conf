# Companion (README.md): Nightdrive on an iPad or a phone, a web app over Tailscale. Needs the Tailscale plugin, logged in.
name=Companion
icon=tablet-smartphone
description=Your Claude Code sessions, dictation and buttons of your own on an iPad or a phone, over Tailscale (experimental)
default=off
install=bin/companion enable
installed=systemctl --user -q is-enabled nightdrive-companion.service
group=plugin
version=0.1.0
author=@jarilehtinen
# No tools for Claude: it is the user's remote for the desktop, and Claude already has its own ways to the sessions
# and the actions it offers (#3051)
mcp=none
