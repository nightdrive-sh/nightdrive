# Recorder (README.md): sound from a microphone recorded into ~/Recordings by pw-record, which goes on with the window
# closed (lib/capture.py), in a Quickshell window of its own (app/, `recorder`), and turned into text by Voxtype's models.
# One of Nightdrive's apps, like Mail and Notes.
name=Recorder
icon=mic
description=Record from a microphone into ~/Recordings, pause and go on, and turn it into text
default=off
install=bin/recorder install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-recorder.desktop"
packages=pipewire-utils ffmpeg-free python3 jq
group=app
version=0.1.0
author=@jarilehtinen
