# Garage (README.md): virtual machines in a window of its own (app/, `garage`), qemu/KVM underneath. One of Nightdrive's
# apps, but not on every install (bundled=no): it waits in Install › Recommended. install.sh puts in qemu and the UEFI
# firmware for this machine's architecture (lib/arch.sh's PACKAGES; packages= below lists both, for nightdrive minimal)
# and Garage among the desktop's apps.
name=Garage
icon=warehouse
description=Virtual machines: start, snapshot and restore them
default=off
install=install.sh
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/garage.desktop"
packages=qemu-img qemu-ui-sdl qemu-ui-opengl qemu-system-aarch64-core edk2-aarch64 qemu-device-display-virtio-gpu-pci-gl qemu-system-x86-core edk2-ovmf qemu-device-display-virtio-vga-gl
group=app
bundled=no
version=0.1.2
author=@jarilehtinen
