# Mail (README.md): Nightdrive Mail, a mail client over notmuch in a Quickshell window of its own (app/, `nightmail`),
# with mbsync's sync every 5 minutes and as soon as mail comes (systemd/). install.sh sets up the packages; the account
# is the user's, by README.md.
name=Mail
icon=mail
description=Mail over notmuch: quiet reading, notifications, Claude's replies
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-mail-sync.timer
packages=notmuch isync libsecret zenity python3
group=app
version=0.1.2
author=@jarilehtinen
setup=bin/nightmail setup
configured=test -s "${XDG_CONFIG_HOME:-$HOME/.config}/nightmail/account.conf"
welcome=Your email in Nightdrive Mail, supports Claude writes (⌘⇧C).
