# Network Drives (README.md): rclone mount as a user service per drive (bin/netdrive, lib/, systemd/), a top bar icon
# that shows only when a drive needs a look (module.jsonc, status, NetdriveMenu.qml), and its status for Claude (mcp.json).
name=Network Drives
icon=cloud
description=A Storage Box, an SFTP server or any rclone remote as a folder in home, without hangs offline (experimental)
default=off
install=rpm -q rclone fuse3 >/dev/null || sudo dnf install -y rclone fuse3; bin/netdrive init
installed=test -f ~/.config/nightdrive/netdrive.json
packages=rclone fuse3
group=plugin
version=0.1.0
author=@jarilehtinen
