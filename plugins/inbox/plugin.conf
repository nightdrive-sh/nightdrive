# Inbox (README.md): Nightdrive Inbox's window (app/, `inbox`), where the messages Claude's sessions and apps leave
# (core: `nightdrive inbox`, config/inbox, docs/inbox.md) are read, their buttons pressed and archived. One of
# Nightdrive's apps, on every install: the messages are kept by the core, so a sender never has to ask for this.
# Claude's tools are the core's (inbox_post, inbox_update, inbox_list in config/mcp/tools/inbox.json): none here.
name=Inbox
default=on
icon=mailbox
description=Messages from Claude's sessions and apps, to look at when you have time
install=bin/inbox install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-inbox.desktop"
packages=python3 jq
group=app
mcp=none
version=0.1.0
author=@jarilehtinen
