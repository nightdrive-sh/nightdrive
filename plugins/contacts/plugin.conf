# Contacts (README.md): Nightdrive Contacts, the iCloud, Google and CardDAV contacts kept on this computer as vCards by
# vdirsyncer every 30 minutes (systemd/), in a Quickshell window of its own (app/, `contacts`). install.sh sets up the
# packages; the accounts are the user's, by README.md.
name=Contacts
icon=contact
description=Your iCloud and Google contacts in a window of their own, kept in sync (experimental)
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-contacts-sync.timer
group=plugin
version=0.1.0
author=@jarilehtinen
setup=bin/contacts setup
