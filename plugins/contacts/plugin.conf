# Contacts (README.md): your iCloud, Google and CardDAV contacts on this computer as vCards, synced by vdirsyncer every
# 30 minutes (systemd/). install.sh sets up the packages; the accounts are the user's, by README.md.
name=Contacts
icon=contact
description=Your iCloud and Google contacts on this computer, kept in sync (experimental)
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-contacts-sync.timer
group=plugin
version=0.1.0
author=@jarilehtinen
setup=bin/contacts setup
