# Contacts (README.md): Nightdrive Contacts, the iCloud, Google and CardDAV contacts kept on this computer as vCards by
# vdirsyncer every 30 minutes (systemd/), in a Quickshell window of its own (app/, `contacts`). One of Nightdrive's apps,
# on every install like Mail and Deck. install.sh sets up the packages; the accounts are the user's, by README.md.
name=Contacts
icon=contact
description=Your iCloud and Google contacts in a window of their own, kept in sync
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-contacts-sync.timer
packages=vdirsyncer python3-vobject libsecret python3 ImageMagick
group=app
version=0.1.1
author=@jarilehtinen
setup=bin/contacts setup
configured=test -s "${XDG_CONFIG_HOME:-$HOME/.config}/contacts/accounts.conf"
welcome=Your iCloud and Google contacts on this computer, also in Mail and the Launcher.
