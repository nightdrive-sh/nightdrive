# VNC Display (README.md): an iPad or iPhone as a screen of its own over VNC. bin/vnc-display adds the devices; each
# one's screen is nightdrive-vnc-display@NAME.service (systemd/, lib/serve.py). Hyprland's side is in the core:
# config/hypr/virtual-display.lua, and the top bar's device icons in Bar.qml.
name=VNC Display
icon=tablet
description=An iPad or iPhone as a screen of its own, in a VNC app over Tailscale (experimental)
default=off
install=install.sh
installed=command -v wayvnc >/dev/null && test -f "${XDG_CONFIG_HOME:-$HOME/.config}/nightdrive/vnc-display/rsa_key.pem"
packages=wayvnc openssh-clients
group=plugin
version=0.1.0
author=@jarilehtinen
