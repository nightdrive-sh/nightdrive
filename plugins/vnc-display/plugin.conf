# VNC Display (README.md): an iPad or iPhone as a display of its own over VNC. bin/vnc-display adds the devices; each
# one's screen is nightdrive-vnc-display@NAME.service (systemd/, lib/serve.py). Hyprland's side is in the core:
# config/hypr/virtual-display.lua, and the top bar's device icons in Bar.qml. wayvnc 0.10 or later comes from Nightdrive's
# COPR (install.sh): installed while it's there and the computer has its key.
name=VNC Display
icon=tablet
description=An iPad or iPhone as a display of its own, in a VNC app over Tailscale (experimental)
default=off
install=install.sh
# install.sh adds it through setup-hyprland-repo.sh: named here for Claude's install card (#1926, #1948)
repos=copr:@nightdrive/nightdrive
installed=./install.sh --check
packages=wayvnc openssh-clients qrencode python3-cryptography
group=plugin
version=0.1.0
author=@jarilehtinen
