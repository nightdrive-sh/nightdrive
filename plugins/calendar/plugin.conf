# Calendar (README.md): Nightdrive Calendar, the iCloud and CalDAV calendars of Contacts' accounts and calendars read
# from an ICS address (Google's), kept on this computer by vdirsyncer every 15 minutes (systemd/), in a Quickshell window
# of its own (app/, `calendar`). A first window: events are added in it; changed and deleted with the command, or by Claude.
name=Calendar
icon=calendar
description=Your iCloud and Google calendars in a window of their own, kept in sync
default=off
install=install.sh
installed=systemctl --user -q is-enabled nightdrive-calendar-sync.timer
packages=vdirsyncer khal python3-icalendar libsecret python3
group=app
version=0.1.0
author=@jarilehtinen
configured=test -n "$(python3 lib/sources.py names 2>/dev/null)"
welcome=Your iCloud and Google calendars on this computer, and for Claude.
