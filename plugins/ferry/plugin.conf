# Ferry (README.md): Ferry's own app from its repo (install.sh), with Nightdrive's top bar menu over it. One of Nightdrive's
# apps, on every install like Mail and Deck; Welcome sets it up after Tailscale (./setup, steps.md). The keys mean the
# same as plugins.txt's columns; install and installed run in this folder.
name=Ferry
icon=inbox
description=Files and text both ways with your phone over Tailscale, no app
default=off
install=install.sh
installed=systemctl --user -q is-enabled ferry.service
packages=python3-cryptography qrencode
units=ferry.service
group=app
version=0.3.1
author=@jarilehtinen
setup=./setup
configured=~/.local/bin/ferry list --json | jq -e '.setup == null and .push > 0'
welcome=Photos, files and text both ways with your phone, from anywhere: on your tailnet, no app needed.
