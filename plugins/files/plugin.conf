# Files (README.md): Nightdrive's own file manager, a Quickshell window of its own (app/, `files`) with yazi's keys
# beside the desktop's ⌘ keys, the folders' default app in Nautilus's place (Hyper F), and org.freedesktop.FileManager1
# for other apps' "Show in folder" (lib/fm1.py). One of Nightdrive's apps, like Mail and Tasks.
name=Files
icon=folder-open
description=Your files and folders, with yazi's keys and a preview
default=off
install=install.sh
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-files.desktop"
packages=python3 python3-gobject wl-clipboard poppler-utils fd-find
group=app
version=0.1.0
author=@jarilehtinen
welcome=Files opens your folders now: Hyper F, or any folder another app opens. ? lists its keys.
# Claude's tools for files are the core's (config/mcp/tools/apps-files.json): open, trash, move, rename with Claude's
# own rules. Files adds none of its own.
mcp=none
