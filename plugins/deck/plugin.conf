# Deck (README.md): the deck package from Nightdrive's COPR, by install.sh (built from source where there is none). The
# launcher's Music level, its player row and Ctrl+Space are this folder's MusicLevels.qml; the window is app/ (bin/deck-window).
name=Deck
icon=disc-3
description=Spotify player (needs Premium), launcher and top bar
default=on
install=install.sh
installed=test -x ~/.local/bin/deck
packages=deck
group=app
version=1.1.4
author=@jarilehtinen
setup=bin/deck-window setup
configured=bin/deck-window configured
welcome=Music player that recommends albums for you. Requires Spotify Premium account.
