# Apostrophe (README.md): the Flatpak, and .md files open in it. Its theme stays in the core (config/gtk-4.0, linked by
# link.sh): the sandbox is given read access to that folder, so moving the file would need a new override on every install.
name=Apostrophe
icon=file-text
description=Markdown editor (Flatpak), opens .md files
default=on
install=install.sh
installed=flatpak info --user org.gnome.gitlab.somas.Apostrophe
group=recommended
version=1.0.0
author=@jarilehtinen
