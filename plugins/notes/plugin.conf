# Notes (README.md): the Markdown files in ~/Notes, in a Quickshell window of its own to read them (app/, `notes`),
# Apostrophe to write them, and Claude's tools (mcp.json). One of Nightdrive's apps; whether it comes on every install
# is decided before it is released (Dashboard #1781), so until then it waits in Install › Recommended (bundled=no).
name=Notes
icon=notebook-pen
description=Your Markdown notes in ~/Notes, to read and to find; Apostrophe writes them
default=off
install=bin/notes install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-notes.desktop"
packages=python3 jq
group=app
bundled=no
version=0.1.0
author=@jarilehtinen
