# Notes (README.md): the Markdown files in ~/Notes, in a Quickshell window of its own to read and write them (app/,
# `notes`), Apostrophe as another way to write them, and Claude's tools (mcp.json). One of Nightdrive's apps, like Mail and Contacts.
name=Notes
icon=notebook-pen
description=Your Markdown notes in ~/Notes, to read, write and find
default=off
install=bin/notes install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-notes.desktop"
packages=python3 jq
group=app
version=0.1.0
author=@jarilehtinen
