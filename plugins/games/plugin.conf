# Games (README.md): the games on this computer as covers in a window of its own (app/, `games`), floating in the
# middle; the controller's Xbox button opens it. One of Nightdrive's apps, on every install. The games list, the Xbox button's
# service and Claude's tools are the core's (hypr/scripts/games and gamepad-home, nightdrive-gamepad.service,
# games_list and games_launch in config/mcp/tools/apps-files.json), so they work without the window: mcp=none here.
name=Games
default=on
icon=gamepad-2
description=Your games with their covers, played with a controller or the keyboard
install=bin/games install
installed=test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/nightdrive-games.desktop"
packages=python3 python3-evdev
group=app
mcp=none
version=0.1.0
author=@jarilehtinen
