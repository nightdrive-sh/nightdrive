# greetd waits for the graphics driver before it starts Hyprland (wait-gpu.sh says why).
# Installed as /etc/systemd/system/greetd.service.d/nightdrive-gpu.conf by config/greeter/install.sh: drop-ins are read
# in name order, so this ExecStartPre runs before the boot splash's (nightdrive-splash.conf), which lets Plymouth go:
# the splash stays on screen while it waits.
[Service]
# "-": a failure here must never keep the login screen from starting
ExecStartPre=-/bin/sh /etc/greetd/wait-gpu.sh
