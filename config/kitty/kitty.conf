# kitty – Mac-style keys (⌘ = super), Omarchy-style look

# --- Font ---
font_family      family='JetBrains Mono' style=Thin
bold_font        family='JetBrains Mono' style=SemiBold
font_size        9.5

# --- Appearance ---
window_padding_width 10
enable_audio_bell    no
confirm_os_window_close 0
cursor_shape         block
cursor_blink_interval 0

# --- Clipboard: ⌘C / ⌘V (Ctrl+Shift+C/V works too) ---
map super+c copy_to_clipboard
map super+v paste_from_clipboard
# Hyprland sends ⌘C/⌘V as Ctrl+Insert / Shift+Insert
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# --- Other Mac habits ---
map super+n     new_os_window
map super+k     clear_terminal to_cursor active
map super+equal change_font_size all +1.0
map super+plus  change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0     change_font_size all 0

# Option+arrows jump over a word like in iTerm
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf
# Ctrl+⌫ deletes the previous word like in other apps (^W); also what ⌥⌫ arrives as when keyd remaps it
map ctrl+backspace send_text all \x17
# ⌘⌥← / ⌘⌥→ (Hyprland sends Ctrl+PageUp/Down) switch kitty tabs
map ctrl+page_up previous_tab
map ctrl+page_down next_tab

# --- Tokyo Night (Omarchy's default theme), the background 10 % darker, a touch more violet ---
background            #181722
foreground            #c0caf5
selection_background  #33467c
selection_foreground  #c0caf5
cursor                #c0caf5
cursor_text_color     #181722
url_color             #73daca
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Transparency
background_opacity 0.97
# The opacity can change on a config reload (the look's file below)
dynamic_background_opacity yes

# The look (`nightdrive theme set background …`, hypr/scripts/theme): background and opacity. The values above are its
# defaults, for when the file hasn't been written yet.
include ~/.cache/nightdrive/kitty.conf

# --- Links ---
# Ctrl+click opens a link in the browser (xdg-open → Firefox). Ctrl+Shift+click works too (kitty's default).
# ⌘+click wouldn't work: Hyprland uses ⌘+left button for moving windows.
# A file or folder path in plain text (Claude Code prints them so) opens too: a folder in Files, a file in the code
# editor at its line (`file.py:42`). open_path.py reads the path under the mouse and falls back to the link click.
open_url_with default
mouse_map ctrl+left release grabbed,ungrabbed kitten open_path.py
mouse_map ctrl+left press grabbed discard_event
# Ctrl+⌘+click too: the link's window then floats in the centre (Hyprland: hypr/float-link.lua)
mouse_map ctrl+super+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+super+left press grabbed discard_event

# --- Selection ---
# Selected text is copied to the clipboard immediately (as in Claude's CLI). In programs that grab the mouse
# (e.g. Claude Code, tmux, vim), select while holding Shift.
copy_on_select clipboard

# --- Right button ---
# Claude Code (mouse grabbed) pastes the clipboard on right click → block the event from reaching the program.
mouse_map right press grabbed discard_event
mouse_map right release grabbed discard_event

# --- Scrolling ---
# Touchpad speed: the default (1.0) with Hyprland's scroll_factor 1.0; all app speeds in hypr/scroll.lua
touch_scroll_multiplier 1.0

# Your own settings (font, keys…) from a private overlay, over Nightdrive's (README › Make it yours). Missing is fine.
include local.conf
