# NetworkManager's connectivity check, which Nightdrive's "No internet" notification and the top bar's network icon
# follow (config/hypr/scripts/net-watch, #2057). Fedora's own check (the NetworkManager-config-connectivity-fedora
# package's URI, which GNOME's Fedora uses), not installed everywhere: without it NM always says "full".
# interval: while online NM fetches this two-byte file once a minute (only while a connection is up; never asleep),
# rather than Fedora's 300 s, so a drop shows within about a minute; a link change checks at once, and with trouble
# found NM checks again every few seconds. One tiny request a minute costs no battery worth measuring.
# Put in place by install.sh and nightdrive update (config/system/sync).
[connectivity]
enabled=true
uri=http://fedoraproject.org/static/hotspot.txt
response=OK
interval=60
