# Installed by Nightdrive (install.sh, nightdrive update) as /etc/dnf/libdnf5.conf.d/90-nightdrive.conf: packages dnf
# never installs here. Adds to your own excludepkgs in /etc/dnf/dnf.conf, doesn't replace them.
# nwg-panel: Fedora's package supplements hyprland, so dnf would bring a second panel along with Hyprland
[main]
excludepkgs=nwg-panel
