# Nightdrive: more inotify instances per user (the kernel's default is 128).
# Every Quickshell FileView that watches a file opens an instance of its own, so the top bar alone takes ~26, each of
# Nightdrive's windows 5-12, a sandbox its own desktop's worth and each terminal or Claude Code session one or two.
# At 128 the next program to start fails with "Too many open files" (EMFILE; Lan Mouse's window, #3160, #3165).
# A higher value set in a later sysctl.d file still wins.
fs.inotify.max_user_instances = 1024
