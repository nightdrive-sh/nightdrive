# hyprtoolkit's look: the windows built on it, such as hyprpolkitagent's password prompt (pkexec, 1Password's
# "Unlock using system authentication"). The app reads this when it starts.
# Theme colour (Settings › Theme › Color): hypr/scripts/theme writes the colours below again, in the theme's hue
background = rgba(0b0b0dff)
base = rgba(16121bff)
alternate_base = rgba(3a2f45ff)
text = rgba(c9bdd3ff)
bright_text = rgba(e0bff2ff)
link_text = rgba(c071ebff)
accent = rgba(c071ebff)
accent_secondary = rgba(5c247bff)
source = ~/.cache/nightdrive/hyprtoolkit.conf

font_family = JetBrains Mono
font_family_monospace = JetBrains Mono
# Sizes in multiples of 5: hyprtoolkit measures a line unhinted and draws it hinted, so when a glyph's advance (0.6 em
# in JetBrains Mono) isn't a whole pixel, the drawn line comes out wider than its box and gets cut short ("Allow this
# actio…"). At 5, 10, 15, 20 pt it is a whole pixel at scales 1, 1.5 and 2.
# h3 is the polkit prompt's message, on one line the agent cuts at its field's width (hyprpolkitagent.conf): at 10 it
# fits ~57 characters there, at 15 only ~37
h1_size = 20
h2_size = 15
h3_size = 10
font_size = 10
small_font_size = 10
