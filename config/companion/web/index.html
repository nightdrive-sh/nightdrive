<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightdrive">
<title>Nightdrive</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/question.css">
<link rel="stylesheet" href="/permission.css">
<link rel="stylesheet" href="/presence.css">
<link rel="stylesheet" href="/inbox.css">
<style>
/* When the page didn't load whole (boot.js): here, not in app.css, which may be the file that failed. Shown at once by
   boot.js after its second try, or on its own after a while when boot.js never ran (html never gets .ready). */
.loadfail { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #0b0b0d; color: #c9bdd3;
            font: 14px/1.45 ui-monospace, monospace; visibility: hidden; animation: loadfail 0s 20s forwards; }
.loadfail h1 { margin: 0; font-size: 17px; font-weight: 500; color: #ffffff; }
.loadfail p { margin: 0; max-width: 34em; color: #aea3b5; }
.loadfail .what { font-size: 12px; color: #9486a3; overflow-wrap: anywhere; }
.loadfail a { margin-top: 6px; padding: 10px 22px; border-radius: 10px; background: #c071eb; color: #0b0b0d;
              font-weight: 500; text-decoration: none; }
.load-failed .loadfail { visibility: visible; animation: none; }
.ready:not(.load-failed) .loadfail { display: none; }
@keyframes loadfail { to { visibility: visible; } }
</style>
</head>
<body>
<div class="app">
  <header class="top"></header>
  <div class="board">
    <section class="sessions" aria-label="Claude Code sessions"></section>
    <aside class="side">
      <div class="dictate">
        <div class="head"><span class="sec">Dictate</span><span class="spacer"></span><span class="time"></span></div>
        <div class="spacer" style="display:flex;align-items:center">
          <button class="mic" aria-label="Hold to dictate">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          </button>
        </div>
        <div class="hint" aria-live="polite"></div>
        <div class="target"></div>
      </div>
      <div class="actions">
        <div class="head"><span class="sec">Actions</span><span>hold to change</span></div>
        <div class="slots"></div>
      </div>
    </aside>
  </div>
</div>
<!-- A plain link, so Reload works with no script at all (boot.js) -->
<div class="loadfail" role="alert">
  <h1>The page didn't load whole</h1>
  <p>Part of it didn't come through from the computer, on a second try too: the connection dropped, or Companion is
    starting again.</p>
  <p class="what"></p>
  <a href="/">Reload</a>
</div>
<script src="/boot.js"></script>
</body>
</html>
