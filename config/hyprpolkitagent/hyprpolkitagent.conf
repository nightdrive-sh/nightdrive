# hyprpolkitagent's password prompt (its look: hypr/hyprtoolkit.conf). The agent reads this when it starts.
# It draws the action's message on one line, cut with "…" at password_field_width ("System policy prevents insp…"):
# there is no setting to wrap it. So the window is as wide as the agent allows (600; hyprland.lua sizes it, since
# floating it opens at its minimum) and the field, and with it the message, as wide as it can be: with h3_size 10 in
# hyprtoolkit.conf that is ~57 characters (firewalld's 55 fit; half of Fedora's messages are over 58, the longest 99).
# Not wider: from ~485 in a 600 window the agent leaves the password field out altogether, and no password can be
# typed (500 did, 28.10.2026: every prompt timed out).
general {
    window_width = 600
    password_field_width = 450
}
