# Network speakers (AirPlay, Sonos) aren't remembered across a login, as on a Mac: WirePlumber's state forgets them
# before it starts, so sound comes from the computer, or from headphones chosen before (hypr/scripts/forget-network-sound).
# "-": if the script fails or is gone, WirePlumber starts anyway.
[Service]
ExecStartPre=-%h/.config/hypr/scripts/forget-network-sound
